version: 1
project:
  name: krea2_style
  output_dir: output
  models_dir: models
  cache_dir: ''
  hf_token: ''
model:
  arch: krea2
  transformer_path: ''
  text_encoder_path: ''
  tokenizer_path: ''
  vae_path: ''
  dtype: bf16
  transformer_quant: auto
  text_encoder_quant: auto
  block_swap: -1
  gradient_checkpointing: true
  attention: sdpa
dataset:
  folders: []
  resolutions:
  - 768
  - 1024
  trigger_word: sks style
  trigger_position: prefix
  default_caption: ''
  caption_dropout: 0.05
  flip_horizontal: true
  bucket_min: 512
  bucket_max: 2048
  bucket_step: 64
  num_workers: 0
network:
  rank: 16
  alpha: 16.0
  dropout: 0.0
  rank_dropout: 0.0
  target: all_linear
  include_regex: ''
  exclude_regex: ''
  rs_lora: false
  init_weights: ''
train:
  max_steps: 3000
  batch_size: 1
  grad_accum: 1
  learning_rate: 0.0001
  optimizer: adamw8bit
  weight_decay: 0.01
  betas:
  - 0.9
  - 0.999
  eps: 1.0e-08
  lr_scheduler: constant
  warmup_steps: 0
  max_grad_norm: 1.0
  ema_decay: 0.98
  loss: mse
  huber_delta: 0.1
  timestep:
    sampling: logit_normal
    logit_mean: 0.0
    logit_std: 1.0
    shift_mode: auto
    shift: 3.0
    clean_share: 60.0
  adaptive:
    enabled: false
    plateau: true
    plateau_patience: 300
    plateau_factor: 0.5
    plateau_threshold: 0.01
    min_lr_ratio: 0.1
    divergence: true
    spike_ratio: 3.0
    max_recover: 3
    recover_factor: 0.5
    snapshot_every: 100
    auto_clip: false
    auto_clip_k: 3.0
    eval_every: 100
    eval_samples: 4
    val_holdout: 0
    early_stop: false
    early_stop_patience: 5
  seed: 42
  save_every: 250
  keep_last: 4
  save_dtype: bf16
  save_format: kohya
  save_state: true
  resume_state: ''
  comfy_lora_dir: ''
sample:
  enabled: true
  every: 250
  at_start: false
  prompts:
  - '[trigger], a lighthouse on a cliff at sunset'
  - '[trigger], a cat sleeping on a bookshelf'
  - a lighthouse on a cliff at sunset
  negative_prompt: ''
  width: 768
  height: 768
  steps: 20
  guidance: -1.0
  seed: 1234
  sampler: auto
  turbo: true
  turbo_lora: ''
  turbo_strength: 0.7
  turbo_steps: 10
